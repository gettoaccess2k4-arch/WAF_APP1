upstream backend    { server backend:5000; }
upstream user_fe    { server user-fe:3000; }
upstream admin_fe   { server admin-fe:3001; }

# ── shop.lab.local ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name shop.lab.local;

    # Pass API requests to unified backend, forwarding Host so the backend
    # can distinguish user-app vs admin-app traffic (WAF traffic-mapping test).
    location /api/ {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-App-Source      user;
    }

    # Uploaded files served directly (WAF test: web-shell access)
    location /uploads/ {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
    }

    # All other traffic → User React app
    location / {
        proxy_pass         http://user_fe;
        proxy_set_header   Host              $host;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

# ── admin.lab.local ───────────────────────────────────────────────────────────
server {
    listen 80;
    server_name admin.lab.local;

    location /api/ {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-App-Source      admin;
    }

    location /uploads/ {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
    }

    location / {
        proxy_pass         http://admin_fe;
        proxy_set_header   Host              $host;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

# ── Fallback: direct IP access ────────────────────────────────────────────────
server {
    listen 80 default_server;
    return 200 '{"status":"WAFLab Nginx OK","hosts":["shop.lab.local","admin.lab.local"]}';
    add_header Content-Type application/json;
}
