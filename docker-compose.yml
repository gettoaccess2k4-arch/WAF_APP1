version: '3.9'

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: waflab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: waflab
      POSTGRES_USER: waflab
      POSTGRES_PASSWORD: waflab123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/config/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - wafnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waflab"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Unified Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waflab_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: waflab
      DB_USER: waflab
      DB_PASS: waflab123
      ACCESS_TOKEN_SECRET: waflab_access_secret_2024
      REFRESH_TOKEN_SECRET: waflab_refresh_secret_2024
      NODE_ENV: development
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wafnet

  # ── User Frontend ────────────────────────────────────────────────────────────
  user-fe:
    build:
      context: ./user-app
      dockerfile: Dockerfile
    container_name: waflab_user_fe
    restart: unless-stopped
    networks:
      - wafnet

  # ── Admin Frontend ───────────────────────────────────────────────────────────
  admin-fe:
    build:
      context: ./admin-app
      dockerfile: Dockerfile
    container_name: waflab_admin_fe
    restart: unless-stopped
    networks:
      - wafnet

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: waflab_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - user-fe
      - admin-fe
    networks:
      - wafnet

volumes:
  postgres_data:
  uploads_data:

networks:
  wafnet:
    driver: bridge
